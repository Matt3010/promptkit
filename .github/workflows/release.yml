name: release

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - "release/v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_REF" == refs/heads/release/v* ]]; then
            VERSION="${GITHUB_REF_NAME#release/v}"
          else
            echo "Unsupported release ref: $GITHUB_REF" >&2
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Release version $VERSION does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG_NAME=v$VERSION" >> "$GITHUB_ENV"

      - name: Verify
        run: npm run verify

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp LICENSE README.md release/
          cp -R docs dist release/
          tar -C release -czf "promptkit-${VERSION}.tar.gz" .
          (cd release && zip -qr "../promptkit-${VERSION}.zip" .)
          sha256sum "promptkit-${VERSION}.tar.gz" "promptkit-${VERSION}.zip" > "promptkit-${VERSION}.sha256"

      - name: Create GitHub Release from tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG_NAME" \
            "promptkit-${VERSION}.tar.gz" \
            "promptkit-${VERSION}.zip" \
            "promptkit-${VERSION}.sha256" \
            --title "PromptKit $TAG_NAME" \
            --generate-notes \
            --verify-tag

      - name: Create GitHub Release from release branch
        if: startsWith(github.ref, 'refs/heads/release/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG_NAME" \
            "promptkit-${VERSION}.tar.gz" \
            "promptkit-${VERSION}.zip" \
            "promptkit-${VERSION}.sha256" \
            --target "$GITHUB_SHA" \
            --title "PromptKit $TAG_NAME" \
            --generate-notes
