name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Unsupported release tag: $GITHUB_REF_NAME. Expected vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Release version $VERSION does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG_NAME=v$VERSION" >> "$GITHUB_ENV"

      - name: Verify
        run: npm run verify

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp LICENSE README.md release/
          cp -R docs dist release/
          tar -C release -czf "promptkit-${VERSION}.tar.gz" .
          (cd release && zip -qr "../promptkit-${VERSION}.zip" .)
          sha256sum "promptkit-${VERSION}.tar.gz" "promptkit-${VERSION}.zip" > "promptkit-${VERSION}.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; nothing to do."
            exit 0
          fi

          gh release create "$TAG_NAME" \
            "promptkit-${VERSION}.tar.gz" \
            "promptkit-${VERSION}.zip" \
            "promptkit-${VERSION}.sha256" \
            --title "PromptKit $TAG_NAME" \
            --generate-notes \
            --verify-tag
