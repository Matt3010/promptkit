name: publish-v0.1.1

on:
  push:
    branches:
      - fix/scatto-interaction-parity

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: 41a16eb18190209e5fe1bfa7b60366591826a715

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify exact release
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "0.1.1"
          npm run verify

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp LICENSE README.md release/
          cp -R docs dist release/
          tar -C release -czf promptkit-0.1.1.tar.gz .
          (cd release && zip -qr ../promptkit-0.1.1.zip .)
          sha256sum promptkit-0.1.1.tar.gz promptkit-0.1.1.zip > promptkit-0.1.1.sha256

      - name: Create GitHub Release once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.1 >/dev/null 2>&1; then
            echo "Release v0.1.1 already exists"
          else
            gh release create v0.1.1 \
              promptkit-0.1.1.tar.gz \
              promptkit-0.1.1.zip \
              promptkit-0.1.1.sha256 \
              --title "PromptKit v0.1.1" \
              --generate-notes \
              --verify-tag
          fi

      - name: Deploy release to Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml -f tag=v0.1.1
