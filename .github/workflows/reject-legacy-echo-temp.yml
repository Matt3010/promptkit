name: reject-legacy-echo-temp

on:
  push:
    branches:
      - feat/declarative-action-feedback
    paths:
      - .github/workflows/reject-legacy-echo-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/declarative-action-feedback
      - name: Reject removed echo field explicitly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/protocol.ts')
          text = path.read_text()
          old = '  if (!validTone(value.tone)) return false;\n  if (value.triggers !== undefined) {'
          new = '  if (!validTone(value.tone)) return false;\n  if (value.echo !== undefined) return false;\n  if (value.triggers !== undefined) {'
          if old not in text:
              raise SystemExit('action definition validation anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit protocol fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/protocol.ts
          git commit -m "fix: reject removed action echo field"
          git push origin HEAD:feat/declarative-action-feedback
