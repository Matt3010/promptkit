name: patch-action-feedback-temp

on:
  push:
    branches:
      - feat/declarative-action-feedback

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/declarative-action-feedback

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wire action UI and bump version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/promptkit.ts')
          text = path.read_text()
          old = 'this.#actions.configure(manifest.actions ?? []);'
          new = 'this.#actions.configure(manifest.actions ?? [], manifest.actionUi);'
          if old not in text:
              raise SystemExit('expected PromptKit configure call not found')
          path.write_text(text.replace(old, new, 1))
          PY
          npm version 0.8.0 --no-git-tag-version

      - name: Commit generated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/promptkit.ts package.json package-lock.json
          git commit -m "chore: align PromptKit 0.8.0 integration"
          git push origin HEAD:feat/declarative-action-feedback
