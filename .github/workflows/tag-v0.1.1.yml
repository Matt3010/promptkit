name: tag-v0.1.1

on:
  push:
    branches:
      - fix/scatto-interaction-parity

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: 41a16eb18190209e5fe1bfa7b60366591826a715
          fetch-depth: 0

      - name: Create tag once
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v0.1.1 >/dev/null 2>&1; then
            echo "v0.1.1 already exists"
            exit 0
          fi
          git tag v0.1.1 41a16eb18190209e5fe1bfa7b60366591826a715
          git push origin v0.1.1
