name: release-0.3.0-once

on:
  push:
    branches:
      - ops/release-0.3.0

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: 56e2b697ef83aa1369999b3d8a981aa9ae0a3b75
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "56e2b697ef83aa1369999b3d8a981aa9ae0a3b75"
          test "$(node -p "require('./package.json').version")" = "0.3.0"

      - name: Verify
        run: npm run verify

      - name: Create exact release tag
        env:
          TAG_NAME: v0.3.0
          TARGET_SHA: 56e2b697ef83aa1369999b3d8a981aa9ae0a3b75
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/$TAG_NAME" | awk '{print $1}')"
            test "$REMOTE_SHA" = "$TARGET_SHA"
          else
            git tag "$TAG_NAME" "$TARGET_SHA"
            git push origin "refs/tags/$TAG_NAME"
          fi

      - name: Build release archives
        env:
          VERSION: 0.3.0
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release
          cp LICENSE README.md release/
          cp -R docs dist release/
          tar -C release -czf "promptkit-${VERSION}.tar.gz" .
          (cd release && zip -qr "../promptkit-${VERSION}.zip" .)
          sha256sum "promptkit-${VERSION}.tar.gz" "promptkit-${VERSION}.zip" > "promptkit-${VERSION}.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v0.3.0
          VERSION: 0.3.0
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; nothing to do."
          else
            gh release create "$TAG_NAME" \
              "promptkit-${VERSION}.tar.gz" \
              "promptkit-${VERSION}.zip" \
              "promptkit-${VERSION}.sha256" \
              --title "PromptKit $TAG_NAME" \
              --generate-notes \
              --verify-tag
          fi

      - name: Deploy release demo to Pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run pages.yml --ref master -f tag=v0.3.0
