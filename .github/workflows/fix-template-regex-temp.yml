name: fix-template-regex-temp

on:
  push:
    branches:
      - feat/declarative-action-feedback
    paths:
      - .github/workflows/fix-template-regex-temp.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/declarative-action-feedback
      - name: Fix Unicode regex escapes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          for name in ('src/protocol.ts', 'src/templates.ts'):
              path = Path(name)
              text = path.read_text()
              text = text.replace('/{{\\s*([^{}]+?)\\s*}}/gu', '/\\{\\{\\s*([^{}]+?)\\s*\\}\\}/gu')
              text = text.replace('/^files\\[(\\d+)]\\.(name|type|size)$/u', '/^files\\[(\\d+)\\]\\.(name|type|size)$/u')
              text = text.replace('/^files\\[\\d+]\\.(?:name|type|size)$/u', '/^files\\[\\d+\\]\\.(?:name|type|size)$/u')
              path.write_text(text)
          PY
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/protocol.ts src/templates.ts
          git commit -m "fix: escape action template regexes"
          git push origin HEAD:feat/declarative-action-feedback
