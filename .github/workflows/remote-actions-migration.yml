name: Remote Actions Migration

on:
  push:
    branches:
      - "feat/remote-actions"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/remote-actions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply feature migration
        run: |
          python3 scripts/remote-actions-migration.py
          python3 scripts/remote-actions-post.py
      - name: Install dependencies
        run: npm ci
      - name: Verify PromptKit
        run: npm run verify
      - name: Commit verified feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add server-backed remote actions"
          git push origin HEAD:feat/remote-actions
