name: finalize-action-feedback-temp

on:
  push:
    branches:
      - feat/declarative-action-feedback
    paths:
      - .github/workflows/finalize-action-feedback-temp.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/declarative-action-feedback

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preserve compatibility and clarify initialization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          # Keep the 0.7 echo protocol accepted while making feedback the preferred API.
          replace_once(
              'src/protocol.ts',
              'export type PromptKitActionTrigger = PromptKitDropActionTrigger;\n\nexport interface PromptKitIndicator {',
              '''export type PromptKitActionTrigger = PromptKitDropActionTrigger;

export interface PromptKitDropFilesEcho {
  type: "drop-files";
  /** Semantic tone used for the terminal echo. Defaults to secondary. */
  tone?: PromptKitTone;
}

export type PromptKitActionEcho = PromptKitDropFilesEcho;

export interface PromptKitIndicator {''',
          )
          replace_once(
              'src/protocol.ts',
              '  triggers?: PromptKitActionTrigger[];\n  /** Declarative presentation feedback; action semantics stay in the handler. */\n  feedback?: PromptKitActionFeedback;',
              '''  triggers?: PromptKitActionTrigger[];
  /** @deprecated Prefer feedback.before for configurable presentation. Kept for 0.7 compatibility. */
  echo?: PromptKitActionEcho;
  /** Declarative presentation feedback; action semantics stay in the handler. */
  feedback?: PromptKitActionFeedback;''',
          )
          replace_once(
              'src/protocol.ts',
              '  if (value.echo !== undefined) return false;',
              '  if (value.echo !== undefined && !isActionEcho(value.echo)) return false;',
          )
          replace_once(
              'src/protocol.ts',
              'function isActionFeedback(value: unknown): value is PromptKitActionFeedback {',
              '''function isActionEcho(value: unknown): value is PromptKitActionEcho {
  return isRecord(value) && value.type === "drop-files" && validTone(value.tone);
}

function isActionFeedback(value: unknown): value is PromptKitActionFeedback {''',
          )

          replace_once(
              'src/actions.ts',
              '  PromptKitActionDefinition,\n  PromptKitActionUi,',
              '  PromptKitActionDefinition,\n  PromptKitActionEcho,\n  PromptKitActionUi,',
          )
          replace_once(
              'src/actions.ts',
              '''      if (definition?.feedback?.before) {
        this.#applyTemplate(definition.feedback.before, this.#templateValues(definition, context));
      }

      const result = await handler(context);''',
              '''      if (definition?.feedback?.before) {
        this.#applyTemplate(definition.feedback.before, this.#templateValues(definition, context));
      } else if (definition?.echo) {
        this.#legacyEcho(definition.echo, context);
      }

      const result = await handler(context);''',
          )
          replace_once(
              'src/actions.ts',
              '''  #applyTemplate(template: PromptKitSnapshot, values: PromptKitTemplateValues): void {
    this.#applyResult(resolvePromptKitSnapshotTemplate(template, values));
  }
''',
              '''  #legacyEcho(echo: PromptKitActionEcho, context: PromptKitActionContext): void {
    if (context.trigger !== "drop" || context.files.length === 0) return;
    const text = context.files.length === 1
      ? `file: ${context.files[0]?.name ?? ""}`
      : `files: ${context.files.map((file) => file.name).join(", ")}`;
    this.#applyResult({
      blocks: [{ type: "text", text, tone: echo.tone ?? "secondary" }],
    });
  }

  #applyTemplate(template: PromptKitSnapshot, values: PromptKitTemplateValues): void {
    this.#applyResult(resolvePromptKitSnapshotTemplate(template, values));
  }
''',
          )

          replace_once(
              'src/index.ts',
              '  PromptKitActionDefinition,\n  PromptKitActionFeedback,',
              '  PromptKitActionDefinition,\n  PromptKitActionEcho,\n  PromptKitActionFeedback,',
          )
          replace_once(
              'src/index.ts',
              '  PromptKitDropActionTrigger,\n  PromptKitEvent,',
              '  PromptKitDropActionTrigger,\n  PromptKitDropFilesEcho,\n  PromptKitEvent,',
          )

          # Protocol tests: new feedback is preferred, old echo stays valid.
          replace_once(
              'tests/action-feedback-protocol.test.ts',
              '  it("rejects unknown, malformed and legacy echo templates", () => {',
              '  it("rejects unknown and malformed templates while preserving legacy echo", () => {',
          )
          replace_once(
              'tests/action-feedback-protocol.test.ts',
              '''    expect(
      isPromptKitManifest({
        name: "x",
        actions: [{ id: "a", echo: { type: "drop-files" } }],
      }),
    ).toBe(false);
''',
              '''    expect(
      isPromptKitManifest({
        name: "x",
        actions: [{ id: "a", echo: { type: "drop-files" } }],
      }),
    ).toBe(true);
    expect(
      isPromptKitManifest({
        name: "x",
        actions: [{ id: "a", echo: { type: "unknown" } }],
      }),
    ).toBe(false);
''',
          )

          # Runtime compatibility and precedence coverage.
          replace_once(
              'tests/action-feedback.test.ts',
              '''  it("keeps a safe generic error fallback when no custom feedback is declared", async () => {''',
              '''  it("preserves the 0.7 drop-files echo for existing consumers", async () => {
    const handler = vi.fn<PromptKitActionHandler>(() => undefined);
    const { actions, applied } = setup(
      [
        {
          id: "legacy",
          triggers: [{ type: "drop", multiple: true }],
          echo: { type: "drop-files", tone: "info" },
        },
      ],
      { legacy: handler },
    );

    drop([new File(["a"], "a.json"), new File(["b"], "b.json")]);
    await vi.waitFor(() => expect(handler).toHaveBeenCalledTimes(1));
    expect(applied).toEqual([
      { blocks: [{ type: "text", text: "files: a.json, b.json", tone: "info" }] },
    ]);
    actions.destroy();
  });

  it("keeps legacy echo silent outside a non-empty drop context", async () => {
    const handler = vi.fn<PromptKitActionHandler>(() => undefined);
    const { actions, applied } = setup(
      [{ id: "legacy", echo: { type: "drop-files" } }],
      { legacy: handler },
    );

    await actions.run("legacy", { trigger: "manual" });
    await actions.run("legacy", { trigger: "drop", files: [] });
    expect(applied).toEqual([]);
    actions.destroy();
  });

  it("prefers feedback.before over deprecated echo when both are declared", async () => {
    const handler = vi.fn<PromptKitActionHandler>(() => undefined);
    const { actions, applied } = setup(
      [
        {
          id: "import",
          triggers: [{ type: "drop" }],
          echo: { type: "drop-files" },
          feedback: {
            before: { blocks: [{ type: "text", text: "new {{files[0].name}}" }] },
          },
        },
      ],
      { import: handler },
    );

    drop([new File(["x"], "config.json")]);
    await vi.waitFor(() => expect(handler).toHaveBeenCalledTimes(1));
    expect(applied).toEqual([{ blocks: [{ type: "text", text: "new config.json" }] }]);
    actions.destroy();
  });

  it("keeps a safe generic error fallback when no custom feedback is declared", async () => {''',
          )

          # Smoke keeps the demo on the new API while guaranteeing the old public contract remains.
          replace_once(
              'scripts/smoke-action-feedback.mjs',
              'const protocol = readFileSync("src/protocol.ts", "utf8");',
              'const protocol = readFileSync("src/protocol.ts", "utf8");\nconst readme = readFileSync("README.md", "utf8");',
          )
          replace_once(
              'scripts/smoke-action-feedback.mjs',
              'assert(!protocol.includes("PromptKitDropFilesEcho"), "legacy drop-files echo remains in the public protocol");',
              'assert(protocol.includes("PromptKitDropFilesEcho"), "0.7 drop-files echo compatibility disappeared");',
          )
          replace_once(
              'scripts/smoke-action-feedback.mjs',
              'assert(demo.includes("await kit.start();\\n  kit.ready();"), "reference initialization is no longer the simple start/ready flow");',
              'assert(demo.includes("await kit.start();\\n  kit.ready();"), "reference initialization is no longer the simple start/ready flow");\nassert(readme.includes("const kit = new PromptKit({ root });\\n\\nawait kit.start();\\nkit.ready();"), "README does not lead with the minimal PromptKit initialization");',
          )

          # README: make the first integration obvious and keep advanced lifecycle optional.
          replace_once(
              'README.md',
              '## Protocol\n',
              '''## Quick start

For a normal consumer, PromptKit initialization is intentionally small:

```ts
const kit = new PromptKit({ root });

await kit.start();
kit.ready();
```

`start()` loads the manifest, applies an optional bootstrap snapshot, and opens optional live events. `ready()` is the only lifecycle call the host makes when it is ready to expose the prompt. Constructor options are only needed for real host concerns such as action handlers, a custom client, focus scope, or loading text.

If the application declares actions, the browser integration still contains only application behavior:

```ts
const kit = new PromptKit({
  root,
  actions: {
    "import-config": async ({ files }) => {
      await importConfig(files[0]);
      return undefined;
    },
  },
});

await kit.start();
kit.ready();
```

Chooser wording, drop feedback, no-match feedback, and error presentation belong in the manifest rather than extra browser callbacks.

## Protocol
''',
          )
          replace_once(
              'README.md',
              '''```ts
const kit = new PromptKit({
  root,
  loading: {
    label: "example-app",
    text: "starting",
  },
});

try {
  await kit.start();
  await initializeRemainingHostState();
  kit.ready();
} catch {
  // start() already moves PromptKit into the failed lifecycle state.
}
```
''',
              '''```ts
const kit = new PromptKit({ root });

await kit.start();
kit.ready();
```

If the host has additional asynchronous initialization that must finish before command input becomes available, keep it explicitly between the two lifecycle calls:

```ts
await kit.start();
await initializeRemainingHostState();
kit.ready();
```

`start()` already moves PromptKit into the failed lifecycle state if its own initialization fails. Catch the error only when the host needs additional error handling.
''',
          )

          replace_once(
              'docs/actions.md',
              'Feedback is optional. If it is absent, PromptKit does not invent an action-specific echo. Handler errors still have a generic safe fallback.\n',
              '''Feedback is optional. If it is absent, PromptKit does not invent new action-specific wording. Handler errors still have a generic safe fallback.

### Compatibility with PromptKit 0.7 `echo`

The 0.7 `echo: { "type": "drop-files" }` field remains accepted and keeps its original behavior so existing manifests do not break. New integrations should prefer `feedback.before`, which can express the same presentation using normal PromptKit blocks and templates. If both are present, `feedback.before` takes precedence so PromptKit never renders duplicate pre-action feedback.
''',
          )

          replace_once(
              'docs/protocol.md',
              '`actions` declares optional presentation triggers. The host must separately register the implementation for each action id in the PromptKit constructor. Declaring an action in the manifest never grants it behavior on its own.\n',
              '''`actions` declares optional presentation triggers. The host must separately register the implementation for each action id in the PromptKit constructor. Declaring an action in the manifest never grants it behavior on its own.

For compatibility with PromptKit 0.7, action definitions may still contain `echo: { "type": "drop-files", "tone": "..." }`. New integrations should use `feedback.before`; when both are present, `feedback.before` takes precedence. This keeps the protocol additive while allowing presentation feedback to evolve beyond one hardcoded echo shape.
''',
          )
          PY

      - name: Verify final branch
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run verify

      - name: Commit finalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/actions.md docs/protocol.md scripts/smoke-action-feedback.mjs src/actions.ts src/index.ts src/protocol.ts tests/action-feedback-protocol.test.ts tests/action-feedback.test.ts
          git commit -m "fix: keep action feedback additive and clarify setup"
          git push origin HEAD:feat/declarative-action-feedback
