name: release-v0.6.0-once

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/release-v0.6.0-once.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: v0.6.0
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify
        run: npm run verify
      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          VERSION=0.6.0
          mkdir -p release
          cp LICENSE README.md release/
          cp -R docs dist release/
          tar -C release -czf "promptkit-${VERSION}.tar.gz" .
          (cd release && zip -qr "../promptkit-${VERSION}.zip" .)
          sha256sum "promptkit-${VERSION}.tar.gz" "promptkit-${VERSION}.zip" > "promptkit-${VERSION}.sha256"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.6.0 >/dev/null 2>&1; then
            echo "Release v0.6.0 already exists"
            exit 0
          fi
          gh release create v0.6.0 \
            promptkit-0.6.0.tar.gz \
            promptkit-0.6.0.zip \
            promptkit-0.6.0.sha256 \
            --title "PromptKit v0.6.0" \
            --generate-notes \
            --verify-tag
